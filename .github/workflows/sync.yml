name: Sync project sources

# Refreshes the archive from the individual project repositories.
#
# Those repositories are private, so this needs a token: create a fine-grained
# personal access token with read-only "Contents" access to them, and save it as
# the repository secret SYNC_TOKEN. Without the secret the job skips quietly —
# `deno task sync --local` on a machine that has the folders still works.
#
# This is a bridge, not a permanent part of the archive: once the original
# repositories are retired, delete this workflow.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.8

      - name: Check for SYNC_TOKEN
        id: token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::notice::SYNC_TOKEN is not set; skipping the remote sync. Add the secret, or run deno task sync --local locally."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure the commit identity
        if: steps.token.outputs.skip != 'true'
        run: |
          git config user.name "archive sync"
          git config user.email "archive-sync@users.noreply.github.com"

      - name: Import new commits and push
        if: steps.token.outputs.skip != 'true'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: deno task sync --push
